spring.application.name=core-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sketchsync}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345678}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8081

management.endpoints.web.exposure.include=health,info

app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-which-is-at-least-32-bytes-long}
app.jwt.expiration-ms=3600000